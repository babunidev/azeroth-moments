[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azeroth-moments"
version = "1.0.0"
description = "Automatically share World of Warcraft screenshots on Instagram and Discord"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Babuni.dev"}]
dependencies = [
  "watchdog>=4.0",
  "Pillow>=10.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
azeroth-moments = "azeroth_moments.cli:main"

[tool.setuptools.packages.find]
include = ["azeroth_moments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
